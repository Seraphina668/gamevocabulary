import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
const $=id=>document.getElementById(id);
let audioCtx=null,soundEnabled=true,lastWarnAt=0,lastDangerAt=0,quizActive=false,quizOptions=[],quizInput=null,activeSpeakWord='';
let speechRate=.9;
let chosenUnit=Number(localStorage.getItem('wordops_unit')||0);
const UNIT_TITLES=['全册复习','Happy Holiday','Home Sweet Home','Same or Different?','Amazing Plants and Animals','What a Delicious Meal!','Plan for Yourself','When Tomorrow Comes',"Let's Communicate!"];
function initAudio(){if(!soundEnabled)return null;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch(e){return null}}
function beep(freq=440,duration=.13,kind='sine',gain=.09,slide=0){let c=initAudio();if(!c)return;let o=c.createOscillator(),v=c.createGain(),t=c.currentTime;o.type=kind;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(45,freq+slide),t+duration);v.gain.setValueAtTime(.001,t);v.gain.exponentialRampToValueAtTime(Math.max(.002,gain),t+.009);v.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(v);v.connect(c.destination);o.start(t);o.stop(t+duration+.02)}
function sound(name){if(!soundEnabled)return;switch(name){case 'warning':beep(440,.18,'triangle',.065,-180);setTimeout(()=>beep(330,.17,'triangle',.06,-90),170);break;case 'danger':beep(680,.16,'sawtooth',.09,-250);setTimeout(()=>beep(540,.16,'sawtooth',.07,-190),165);break;case 'shot':beep(145,.14,'sawtooth',.12,-90);beep(800,.055,'square',.045,-540);break;case 'hit':beep(300,.10,'triangle',.11,-190);break;case 'hurt':beep(140,.32,'sawtooth',.14,-90);break;case 'kill':beep(380,.12,'triangle',.08,-200);setTimeout(()=>beep(180,.22,'triangle',.06,-80),120);break;case 'correct':beep(580,.11,'sine',.09,180);setTimeout(()=>beep(840,.2,'sine',.08,140),115);break;case 'wrong':beep(240,.19,'triangle',.08,-70);break;case 'reward':beep(520,.12,'sine',.09,160);setTimeout(()=>beep(790,.18,'sine',.09,210),130);break;case 'win':for(let i=0;i<4;i++)setTimeout(()=>beep([440,554,660,880][i],.2,'sine',.09),i*160);break}}
function speakWord(word){activeSpeakWord=word;if(!('speechSynthesis' in window)){toast('当前浏览器不支持英语朗读');return}try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=speechRate;u.pitch=1;let voices=speechSynthesis.getVoices(),us=voices.find(v=>v.lang.toLowerCase()==='en-us'&&v.localService)||voices.find(v=>v.lang.toLowerCase()==='en-us')||voices.find(v=>v.lang.toLowerCase().startsWith('en'));if(us)u.voice=us;speechSynthesis.speak(u)}catch(e){toast('朗读暂时不可用')}}
function addSpeechSpeed(){let t=document.querySelector('.quizTools');if(!t||document.getElementById('speechSpeed'))return;let b=document.createElement('button');b.className='btn';b.id='speechSpeed';b.type='button';b.textContent='语速：正常';b.onclick=()=>{speechRate=speechRate===.9?.68:.9;b.textContent=speechRate===.9?'语速：正常':'语速：慢速';if(activeSpeakWord)speakWord(activeSpeakWord)};t.append(b)}
function updateUnitLabel(){$('unitBtn').textContent=chosenUnit?' Unit '+chosenUnit:'全册复习'}
function changeUnit(){if(state==='play'){modal('选择英语训练单元','切换后，新出现的题目将从所选单元抽取。',[...UNIT_TITLES.map((name,i)=>({label:(i===chosenUnit?'当前 · ':'')+(i===0?'综合复习':'Unit '+i+' · '+name),fn:()=>{chosenUnit=i;localStorage.setItem('wordops_unit',i);updateUnitLabel();resume();toast('已切换：'+(i?'Unit '+i:'全册复习'))}})),{label:'返回行动',fn:resume}])}else{chosenUnit=(chosenUnit+1)%9;localStorage.setItem('wordops_unit',chosenUnit);updateUnitLabel()}}
function flashDamage(){let e=$('damageFlash');e.classList.add('flash');setTimeout(()=>e.classList.remove('flash'),110)}
function sparks(at,color=0xffd06c,count=8){for(let i=0;i<count;i++){let m=new THREE.Mesh(new THREE.IcosahedronGeometry(.055,0),new THREE.MeshBasicMaterial({color}));m.position.copy(at);scene.add(m);let dir=new THREE.Vector3((Math.random()-.5)*2,Math.random()*1.6,(Math.random()-.5)*2);let born=performance.now();function tick(){let k=(performance.now()-born)/330;if(k>=1){scene.remove(m);m.geometry.dispose();m.material.dispose();return}m.position.copy(at).addScaledVector(dir,k);m.scale.setScalar(1-k);requestAnimationFrame(tick)}requestAnimationFrame(tick)}}

let stick=$('stick'),knob=$('knob');function stickMove(e){let r=stick.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),l=Math.hypot(x,y),m=r.width*.33;if(l>m){x=x/l*m;y=y/l*m}move.x=x/m;move.z=y/m;knob.style.transform=`translate(${x}px,${y}px)`}stick.onpointerdown=e=>{stick.setPointerCapture(e.pointerId);stickMove(e)};stick.onpointermove=e=>{if(stick.hasPointerCapture(e.pointerId))stickMove(e)};function stopStick(){move.x=move.z=0;knob.style.transform='translate(0,0)'}stick.onpointerup=stopStick;stick.onpointercancel=stopStick;
function resizeGame(){const w=window.innerWidth,h=window.innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);document.documentElement.style.setProperty('--screen-height',h+'px')}window.addEventListener('resize',resizeGame);window.addEventListener('orientationchange',()=>setTimeout(resizeGame,200));resizeGame();
const fullBtn=$('fullscreenBtn');fullBtn.onclick=async()=>{try{if(document.fullscreenElement){await document.exitFullscreen();return}const root=document.documentElement;const req=root.requestFullscreen||root.webkitRequestFullscreen;if(req){await req.call(root);return}toast('此浏览器不支持网页全屏，可将网页添加到主屏幕后横屏使用')}catch(e){toast('全屏不可用：请尝试浏览器菜单或添加到主屏幕')}};document.addEventListener('fullscreenchange',()=>{fullBtn.textContent=document.fullscreenElement?'退出全屏':'全屏';resizeGame()});function animate(t){requestAnimationFrame(animate);let dt=Math.min(.05,(t-last)/1000);last=t;try{step(dt)}catch(e){console.error(e);$('target').textContent='运行错误：'+e.message}}requestAnimationFrame(animate);$('loading').remove();ui();start();
